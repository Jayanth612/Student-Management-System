# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username= root
spring.datasource.password=Yoimiya3000!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# This tells Hibernate to run import.sql at startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.admin.password=${ADMIN_PASSWORD:iamadmin}
